<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Cover Studio — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Neon Cover Studio</h1>
    <p class="tagline">Your photo + a caption, made into a neon-sunset cover. Nothing ever leaves your machine.</p>

    <fieldset>
      <legend>Layout</legend>
      <div class="row" id="layouts">
        <button type="button" data-layout="poster" class="active">Poster · 3 panels</button>
        <button type="button" data-layout="grid">Grid · 4 panels</button>
        <button type="button" data-layout="solo">Solo · 1 panel</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Panels — click a panel on the cover to pick it</legend>
      <div class="row wrap" id="panels"></div>
      <div class="row">
        <button type="button" data-sample="pier">Use Pier</button>
        <button type="button" data-sample="boulevard">Use Boulevard</button>
        <label class="upload">Upload a photo <input id="photo" type="file" accept="image/*"></label>
      </div>
      <p class="hint">Drag the cover to reframe the picked panel, or drop an image file onto it.</p>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <button id="recenter" type="button">Center photo</button>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Words <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Size <input id="cap-size" type="range" min="0.6" max="1.6" step="0.05" value="1"></label>
      <label>Height <input id="cap-y" type="range" min="0.55" max="0.95" step="0.01" value="0.86"></label>
      <label>Style
        <select id="theme">
          <option value="sunset" selected>Sunset</option>
          <option value="neon">Neon</option>
          <option value="gold">Gold</option>
          <option value="mono">Mono</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <div class="row">
        <select id="export-size" aria-label="Export size">
          <option value="1080x1080" selected>1080 × 1080 · square</option>
          <option value="1080x1350">1080 × 1350 · portrait</option>
          <option value="1920x1080">1920 × 1080 · wide</option>
        </select>
        <button id="export" type="button" class="primary">Export PNG</button>
      </div>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <div class="stage" id="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
    <canvas id="overlay" width="1080" height="1080" aria-hidden="true"></canvas>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
